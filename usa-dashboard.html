<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Point Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .dashboard-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .map-card {
      background: var(--panel, #ffffff);
      border: 1px solid var(--border, #dce3f0);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      padding: 1rem;
    }

    #us-map {
      width: 100%;
      height: auto;
      display: block;
      background: linear-gradient(180deg, #f8fbff 0%, #f0f6ff 100%);
      border-radius: 10px;
    }

    .state {
      fill: #d9e8ff;
      stroke: #8aa7d6;
      stroke-width: 0.8;
    }

    .state:hover {
      fill: #bfd8ff;
    }

    .point {
      fill: #cf2436;
      stroke: #ffffff;
      stroke-width: 1.5;
      opacity: 0.92;
    }

    .dashboard-help {
      margin-top: 1rem;
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <a href="index.html" style="text-decoration:none; color:inherit;">CarsonPrep</a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="usa-dashboard.html" aria-current="page">US Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <main class="dashboard-shell">
    <section class="section">
      <h1>US Point Dashboard</h1>
      <p>
        Base map is ready for plotting latitude/longitude points. The map currently excludes
        <strong>AK (Alaska)</strong> and <strong>HI (Hawaii)</strong>.
      </p>
    </section>

    <section class="map-card">
      <svg id="us-map" viewBox="0 0 960 600" role="img" aria-label="Map of the United States"></svg>
      <p class="dashboard-help">
        Preloaded with <strong>98 coordinate points</strong>. You can still add more using <span class="mono">window.dashboardMap.addPoints([...])</span>.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

      '31': 'NE', '32': 'NV', '33': 'NH', '34': 'NJ', '35': 'NM', '36': 'NY', '37': 'NC', '38': 'ND', '39': 'OH',
      '40': 'OK', '41': 'OR', '42': 'PA', '44': 'RI', '45': 'SC', '46': 'SD', '47': 'TN', '48': 'TX', '49': 'UT',

    const pointsToPlot = [];

    function addPoints(points) {
      pointsToPlot.push(...points);
      drawPoints();
    }

    function clearPoints() {
      pointsToPlot.length = 0;
      drawPoints();
    }

    function drawPoints() {
      const projected = pointsToPlot
        .map((p) => {
          const coords = projection([p.longitude, p.latitude]);
          if (!coords) return null;
          return { ...p, x: coords[0], y: coords[1] };
        })
        .filter(Boolean);

      const dots = svg.selectAll('circle.point').data(projected, (d, i) => `${d.latitude}-${d.longitude}-${i}`);

      dots.enter()
        .append('circle')
        .attr('class', 'point')
        .attr('r', 4)
        .attr('cx', (d) => d.x)
        .attr('cy', (d) => d.y)
        .append('title')
        .text((d) => `Lat: ${d.latitude}, Lon: ${d.longitude}`);

      dots
        .attr('cx', (d) => d.x)
        .attr('cy', (d) => d.y)
        .select('title')
        .text((d) => `Lat: ${d.latitude}, Lon: ${d.longitude}`);

      dots.exit().remove();
    }

    let projection;

    d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then((us) => {
      const allStates = topojson.feature(us, us.objects.states).features;

      const filteredStates = allStates.filter((feature) => {
        const fips = String(feature.id).padStart(2, '0');
        const abbr = stateFipsToAbbr[fips];
        return abbr && !excludedStateAbbrs.has(abbr);
      });

      projection = d3.geoAlbersUsa();
      projection.fitSize([width, height], { type: 'FeatureCollection', features: filteredStates });

      const path = d3.geoPath(projection);

      svg.append('g')
        .selectAll('path')
        .data(filteredStates)
        .join('path')
        .attr('class', 'state')
        .attr('d', path);

      addPoints(initialCoordinates);
    }).catch((err) => {
      console.error('Failed to load map data:', err);
    });

    window.dashboardMap = { addPoints, clearPoints };
  </script>
</body>
</html>
